project:
  type: book
  output-dir: _book

metadata-files:
  - ../_shared/common.yml

lang: pt

# Citation metadata for the Google Scholar tags (see _shared/common.yml).
# Keep in sync with CITATION.cff; `doi` is the Zenodo concept DOI. The title is
# the one registered on Zenodo (English), so both editions point to one record.
citation:
  type: book
  author:   # repeated here so chapter pages get citation_author too
    - family: Santos
      given: Eduardo
  title: "Ecological Analyses in Julia"
  publisher: Zenodo
  doi: 10.5281/zenodo.23126524
  issued: 2026-10-03   # first release (v1.0.0); stays fixed across versions
  url: https://esantos2ua.github.io/EcologicalAnalysesInJulia/pt/
  pdf-url: https://esantos2ua.github.io/EcologicalAnalysesInJulia/pt/analises-ecologicas-em-julia-pt.pdf

book:
  title: "Análises Ecológicas em Julia"
  subtitle: "Uma introdução à ciência de dados ecológicos com Julia"
  author:
    - name: "Eduardo Santos"
      affiliation: "University of Alberta"
      email: "esantos2@ualberta.ca"
  date: today
  date-format: "DD/MM/YYYY"
  language: pt
  search:
    location: sidebar
  # Sidebar buttons: GitHub repo, PDF download, other edition. repo-actions add
  # "report an issue" / "view source" links under each page's table of contents
  # (no "edit this page": readers are asked to open issues, not pull requests).
  repo-url: https://github.com/esantos2ua/EcologicalAnalysesInJulia
  repo-subdir: pt
  repo-branch: main
  repo-actions: [issue, source]
  sidebar:
    style: docked
    tools:
      # pdf/ is copied next to the site by scripts/build.sh
      - icon: file-earmark-pdf
        href: analises-ecologicas-em-julia-pt.pdf
        text: "Baixar PDF"
      - icon: translate
        href: ../en/
        text: "English version"
  chapters:
    - index.qmd
    - part: "Fundamentos"
      chapters:
        - 01-introducao.qmd
        - 02-perguntas.qmd
        - 03-pre-requisitos.qmd
        - 04-introducao-julia.qmd
    - part: "Manipulação e exploração de dados"
      chapters:
        - 05-tidier.qmd
        - 06-visualizacao.qmd
        - 07-analise-exploratoria.qmd
    - part: "Modelagem"
      chapters:
        - 08-modelos-lineares.qmd
        - 09-glm.qmd
    - part: "Programação para ecologia"
      chapters:
        - 10-funcoes.qmd
        - 11-reamostragem.qmd
    - 99-referencias.qmd
    - historico.qmd
