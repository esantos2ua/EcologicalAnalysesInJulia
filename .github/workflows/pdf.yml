name: Build PDFs for release

# Run by hand (Actions tab > "Build PDFs for release" > Run workflow) before
# creating a release. Renders both editions to PDF and commits them to pdf/ on
# main, so the PDFs are inside the source archive that Zenodo stores.
# Zenodo only archives the repository source, not files attached to a release.
#
# Speed: the PDF execution cache (*/_freeze/*/execute-results/tex.json and
# figure-pdf/) is committed together with the PDFs, so later runs only
# re-execute chapters whose source changed.

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to start the site workflow after the PDFs change

concurrency:
  group: pdf
  cancel-in-progress: false

jobs:
  pdf:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      # Use the exact Julia version that Manifest.toml was resolved with;
      # QuartoNotebookRunner refuses to run notebooks on a different patch version.
      - name: Read Julia version from Manifest.toml
        id: julia
        run: echo "version=$(grep -m1 '^julia_version' Manifest.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ steps.julia.outputs.version }}

      - uses: julia-actions/cache@v2

      - name: Instantiate Julia environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.37'
          tinytex: true

      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu

      - name: Regenerate example dataset
        run: julia --project=. scripts/make_data.jl

      - name: Render PDFs
        run: |
          quarto render pt --profile pdf --to pdf
          quarto render en --profile pdf --to pdf
          mkdir -p pdf
          cp pt/_book/analises-ecologicas-em-julia-pt.pdf pdf/
          cp en/_book/ecological-analyses-in-julia-en.pdf pdf/

      - name: Commit PDFs and PDF execution cache to main
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/ pt/_freeze en/_freeze
          if git diff --cached --quiet; then
            echo "PDFs unchanged; nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update book PDFs"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Commits pushed with GITHUB_TOKEN do not trigger other workflows, so
      # start the site build explicitly; it serves the new PDFs for download.
      - name: Republish the site with the new PDFs
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run publish.yml --ref main

      - uses: actions/upload-artifact@v4
        with:
          name: book-pdfs
          path: pdf/*.pdf
