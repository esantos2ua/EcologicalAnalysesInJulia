name: Render and publish book

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pull requests get their own group, so a PR check never cancels a deploy from main.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, to see which files this push or PR changed

      # Use the exact Julia version that Manifest.toml was resolved with;
      # QuartoNotebookRunner refuses to run notebooks on a different patch version.
      - name: Read Julia version from Manifest.toml
        id: julia
        run: echo "version=$(grep -m1 '^julia_version' Manifest.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ steps.julia.outputs.version }}

      - uses: julia-actions/cache@v2

      - name: Instantiate Julia environment
        run: julia --project=. -e 'using Pkg; Pkg.instantiate(); Pkg.precompile()'

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.9.37'

      - name: Regenerate example dataset
        run: julia --project=. scripts/make_data.jl

      # freeze: auto only re-runs chapters whose .qmd changed. When the environment,
      # the data or the exercise checker changes, drop the cache so every chapter runs
      # again (this also re-checks every exercise solution, via Checks.verify).
      - name: Drop the execution cache if the environment, data or checker changed
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No base commit to compare with; keeping the cache."
          elif git diff --name-only "$BASE" HEAD | grep -qE '^(Project\.toml|Manifest\.toml|data/|exercises/)'; then
            echo "Environment, data or checker changed; re-running every chapter."
            rm -rf pt/_freeze en/_freeze
          else
            echo "Only chapter sources changed; using the cache."
          fi

      - name: Render both editions
        run: ./scripts/build.sh

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _book

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
