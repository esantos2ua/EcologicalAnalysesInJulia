project:
  type: book
  output-dir: _book

metadata-files:
  - ../_shared/common.yml

lang: en

book:
  title: "Ecological Analyses in Julia"
  subtitle: "An introduction to ecological data science with Julia"
  author:
    - name: "Eduardo Santos"
      affiliation: "University of Alberta"
      email: "esantos2@ualberta.ca"
  date: today
  date-format: "YYYY-MM-DD"
  language: en
  search:
    location: sidebar
  # Sidebar buttons: GitHub repo, PDF download, other edition. repo-actions add
  # "report an issue" / "view source" links under each page's table of contents
  # (no "edit this page": readers are asked to open issues, not pull requests).
  repo-url: https://github.com/esantos2ua/EcologicalAnalysesInJulia
  repo-subdir: en
  repo-branch: main
  repo-actions: [issue, source]
  sidebar:
    style: docked
    tools:
      # pdf/ is copied next to the site by scripts/build.sh
      - icon: file-earmark-pdf
        href: ecological-analyses-in-julia-en.pdf
        text: "Download PDF"
      - icon: translate
        href: ../pt/
        text: "Versão em português"
  chapters:
    - index.qmd
    - part: "Foundations"
      chapters:
        - 01-introduction.qmd
        - 02-questions.qmd
        - 03-prerequisites.qmd
        - 04-julia-basics.qmd
    - part: "Wrangling and exploring data"
      chapters:
        - 05-tidier.qmd
        - 06-visualization.qmd
        - 07-exploratory.qmd
    - part: "Modelling"
      chapters:
        - 08-linear-models.qmd
        - 09-glm.qmd
    - part: "Programming for ecology"
      chapters:
        - 10-functions.qmd
        - 11-resampling.qmd
    - 99-references.qmd
    - changelog.qmd
